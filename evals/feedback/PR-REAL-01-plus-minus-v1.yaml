proposed_rule: >-
  When the supplied source reports a +/- quantity without defining its
  statistical meaning, preserve the reported numbers and state that the meaning
  is unknown. Do not label the reported Y as standard deviation, standard
  error, confidence interval, dispersion, spread, or variability, or infer its
  aggregation level or statistical reliability. When the source explicitly
  defines the notation, use that definition rather than over-hedging. This
  restriction does not bar proposing a future experiment with defined
  uncertainty statistics.
