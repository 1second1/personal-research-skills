name: Bug report
description: Report a reproducible problem in a Skill, validator, evaluator, or documentation path.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Share public or synthetic examples only. Keep unpublished drafts, API keys, and participant data private. English or 中文 welcome.
  - type: dropdown
    id: area
    attributes:
      label: Skill or affected area
      options:
        - manuscript-audit
        - paper-reading
        - research-question
        - argument-analysis
        - Installation or documentation
        - Framework CLI or evaluation tools
    validations:
      required: true
  - type: input
    id: path
    attributes:
      label: Affected path (optional)
      placeholder: skills/paper-reading/SKILL.md
    validations:
      required: false
  - type: textarea
    id: command
    attributes:
      label: Command or prompt
      description: Include the exact local command or agent request.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
