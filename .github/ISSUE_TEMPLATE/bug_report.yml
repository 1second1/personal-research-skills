name: Bug report
description: Report a reproducible problem in a Skill, validator, evaluator, or documentation path.
title: "bug: "
labels: [bug]
body:
  - type: input
    id: path
    attributes:
      label: Affected path
      placeholder: skills/paper-reading/SKILL.md
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or prompt
      description: Include the exact local command or agent request.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
