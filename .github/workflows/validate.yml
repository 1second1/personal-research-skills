name: Validate repository

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: research-skills validate
      - run: research-skills validate --run evals/fixtures/run-record-demo/run.yaml
      - run: research-skills evaluate evals/fixtures/paper-reading-demo/evidence-card.md evals/rubrics/paper-reading.yaml --source evals/fixtures/paper-reading-demo/source.md --format json
      - run: research-skills evaluate evals/cases/u-mamba-real-paper/expected-output.md evals/cases/u-mamba-real-paper/rubric.yaml --source evals/cases/u-mamba-real-paper/source-map.md --format json
      - run: research-skills evaluate skills/research-question/examples/expected-output.md evals/rubrics/research-question.yaml --format json
      - run: research-skills evaluate skills/argument-analysis/examples/expected-output.md evals/rubrics/argument-analysis.yaml --format json
      - run: research-skills list --format json
      - run: research-skills compose paper-reading skills/paper-reading/examples/input.md
      - run: python scripts/evaluate_paper_reading.py evals/fixtures/paper-reading-demo/evidence-card.md evals/rubrics/paper-reading.yaml --source evals/fixtures/paper-reading-demo/source.md --json
      - run: python scripts/run_skill.py research-question skills/research-question/examples/input.md
      - run: python scripts/run_skill.py argument-analysis skills/argument-analysis/examples/input.md
