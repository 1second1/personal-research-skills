name: paper-reading
version: 0.3.0
purpose: Produce an evidence-grounded research evidence card from supplied paper text.

inputs:
  - name: paper_text
    required: true
    type: markdown_or_text
  - name: research_context
    required: false
    type: markdown_or_text
  - name: source_locations
    required: false
    type: mapping

outputs:
  - problem
  - evidence
  - conflicts_and_anomalies
  - inferences
  - assumptions
  - boundaries
  - connections
  - next_actions

constraints:
  - Do not present inferences as source facts.
  - Do not silently reconcile conflicting source claims or values.
  - Do not invent page, section, or experiment locations.
  - Mark unsupported conclusions and information gaps explicitly.
  - Make next_actions falsifiable and measurable.
  - Match central feasibility, necessity, causal contribution, and mechanism claims to the evidence that would test them.
  - Do not infer the meaning or variability interpretation of undefined uncertainty notation.
  - Preserve the scope of source-defined uncertainty, such as folds rather than independent runs.
  - Do not equate an unreported check with work not performed, or an unverified risk with an error.
  - Prioritize small discriminating checks by their impact on the central claim.

evaluation:
  - factual_consistency
  - evidence_coverage
  - conflict_detection
  - fact_inference_separation
  - boundary_analysis
  - actionability
